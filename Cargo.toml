[package]
name = "blog"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["crates/*"]

[dependencies]
anyhow = "1.0.104"
blog-compiler = { path = "crates/blog-compiler/" }
blog-server = { path = "crates/blog-server/", optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
default = ["serve"]
serve = ["blog-server"]
