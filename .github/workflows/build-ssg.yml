name: build-ssg
run-name: Build static site generator

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: "target/x86_64-unknown-linux-gnu/release/blog"
          name: blog-x86_64-unknown-linux-gnu

  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: blog-x86_64-unknown-linux-gnu
          path: .
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' blog-x86_64-unknown-linux-gnu

  deploy:
    needs: upload
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/deploy.yml
