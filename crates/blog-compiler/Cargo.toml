[package]
name = "blog-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dircpy = "0.3.20"
jiff = { version = "0.2.37", features = ["serde"] }
openssl = "0.10.81"
pulldown-cmark = { version = "0.13.4", features = ["simd"] }
pulldown-cmark-escape = { version = "0.11.0", features = ["simd"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
typst = "0.15.1"
typst-kit = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
walkdir = "2.5.0"
